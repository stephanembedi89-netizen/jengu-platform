<script>
const C=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),P=(t,a,b)=>C((t-a)/(b-a));
const eo=x=>x>=1?1:1-Math.pow(2,-10*x),ei=x=>x*x*x,eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,ec=x=>1-Math.pow(1-x,3);
const back=x=>{const c1=1.5,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,k)=>a+(b-a)*k,$=s=>document.querySelector(s),NS='http://www.w3.org/2000/svg';
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const A='assets/',layer=$('#layer');
const el=h=>{const d=document.createElement('div');d.innerHTML=h.trim();const e=d.firstChild;layer.appendChild(e);return e};
const sv=(par,tag,at={})=>{const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);par.appendChild(e);return e};

/* ================= WATER (WebGL) ================= */
const RIPS=[]; // {x,y,t,s(strength),c(0 cyan..1 gold..2 pink)}
const gl=$('#gl').getContext('webgl',{preserveDrawingBuffer:true,antialias:false});
const vs=`attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
const fs=`precision highp float;
uniform vec2 R;uniform float T,glow,warm,pink,depth;uniform vec4 rp[16];uniform vec4 rc[16];
float caus(vec2 uv,float t){vec2 p=mod(uv*6.2831*1.6,6.2831)-250.;vec2 i=p;float c=1.;float inten=.005;
 for(int n=0;n<5;n++){float tt=t*(1.-(3.5/float(n+1)));i=p+vec2(cos(tt-i.x)+sin(tt+i.y),sin(tt-i.y)+cos(tt+i.x));
 c+=1./length(vec2(p.x/(sin(i.x+tt)/inten),p.y/(cos(i.y+tt)/inten)));}
 c/=5.;c=1.17-pow(c,1.4);return pow(abs(c),8.);}
void main(){vec2 uv=gl_FragCoord.xy/R;uv.y=1.-uv.y;vec2 asp=vec2(1.,R.y/R.x);
 vec2 off=vec2(0.);float ring=0.;vec3 ringCol=vec3(0.);
 for(int k=0;k<16;k++){vec4 r=rp[k];float age=T-r.z;if(age>0.&&age<3.2&&r.w>0.){vec2 d=(uv-r.xy)*asp;float L=length(d);
   float rad=age*.33;float f=1.-age/3.2;float w=exp(-pow((L-rad)*34.,2.))+.55*exp(-pow((L-rad*.62)*40.,2.));
   off+=normalize(d+1e-5)*w*.012*f*r.w;ring+=w*f*r.w;ringCol+=w*f*r.w*rc[k].rgb;}}
 vec2 u=uv+off+vec2(sin(uv.y*9.+T*.6),cos(uv.x*7.+T*.5))*.003;
 vec3 deep=vec3(.008,.025,.07),mid=vec3(.03,.08,.2);
 vec3 base=mix(mid,deep,smoothstep(.0,1.,length((uv-vec2(.5,.45))*vec2(1.,.8))*1.4));
 base=mix(base,base*.35,depth);
 float c1=caus(u*vec2(1.,1.7),T*.35);float c2=caus(u*vec2(1.,1.7)*1.3+.37,T*.29+3.);
 vec3 lc=mix(vec3(.25,.85,1.),vec3(1.,.78,.32),warm);lc=mix(lc,vec3(1.,.45,.65),pink);
 vec3 col=base+lc*(c1*.55+c2*.25)*glow*(.6+.4*smoothstep(1.,.0,uv.y));
 float ray=pow(max(0.,sin(uv.x*14.+T*.2+sin(uv.x*5.)*2.)),6.)*smoothstep(.85,0.,uv.y)*.12*glow;col+=lc*ray;
 col+=ringCol*.38;col+=vec3(1.)*pow(min(ring,1.2),3.)*.06;
 gl_FragColor=vec4(col,1.);}`;
function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(s);return s}
const prog=gl.createProgram();gl.attachShader(prog,sh(gl.VERTEX_SHADER,vs));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(prog);gl.useProgram(prog);
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(prog,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const U=n=>gl.getUniformLocation(prog,n);
gl.uniform2f(U('R'),540,960);
const COLS=[[.35,.9,1],[1,.78,.32],[1,.45,.65]];
function drawWater(t,glow,warm,pink,depth){
  gl.uniform1f(U('T'),t);gl.uniform1f(U('glow'),glow);gl.uniform1f(U('warm'),warm);gl.uniform1f(U('pink'),pink);gl.uniform1f(U('depth'),depth);
  const act=RIPS.filter(r=>t>=r.t&&t<r.t+3.2).slice(-16);const a=new Float32Array(64),c=new Float32Array(64);
  act.forEach((r,k)=>{a.set([r.x/1080,r.y/1920,r.t,r.s],k*4);c.set([...COLS[r.c]],k*4)});
  gl.uniform4fv(U('rp'),a);gl.uniform4fv(U('rc'),c);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}

/* ================= DROPS falling (hero object) ================= */
const DROPS=[]; // {x,y,t (impact time),c,big}
const fx=$('#fx2');
function addDrop(x,y,t,c=1,s=1,dur=.75){DROPS.push({x,y,t,c,s,dur});RIPS.push({x,y,t,s:1.1*s,c})}
const dropEls=[];
function drawDrops(t){
  DROPS.forEach((d,k)=>{let e=dropEls[k];if(!e){e=sv(fx,'g');sv(e,'ellipse',{rx:0,ry:0,fill:'url(#gg)'});sv(e,'ellipse',{rx:0,ry:0,fill:'#fff',opacity:.7});dropEls[k]=e}
    const p=P(t,d.t-d.dur,d.t);const vis=t>d.t-d.dur&&t<d.t;
    const [b,h]=e.children;if(!vis){b.setAttribute('rx',0);h.setAttribute('rx',0);return}
    const y=lerp(d.y-760*d.s,d.y,p*p),st=1+1.6*p*p;
    b.setAttribute('cx',d.x);b.setAttribute('cy',y);b.setAttribute('rx',9*d.s);b.setAttribute('ry',9*d.s*st);
    h.setAttribute('cx',d.x-3*d.s);h.setAttribute('cy',y-4*d.s*st);h.setAttribute('rx',2.5*d.s);h.setAttribute('ry',4*d.s*st);
    e.setAttribute('opacity',C(p*4));e.style.filter=`drop-shadow(0 0 ${12*d.s}px rgba(245,196,81,.8))`;
  });
}

/* ================= CARDS that surface ================= */
// a: start emerge, b: end (sinks), drop at a-0.15
const CARDS=[
 {src:'m00.jpg',a:25.7,b:28.6,x:540,y:960,w:900,h:600,rot:-1.5},
 {src:'m01.jpg',a:28.4,b:32.6,x:540,y:960,w:540,h:810,rot:1.5},
 {src:'m02.jpg',a:32.4,b:37.2,x:540,y:960,w:540,h:810,rot:-1.5},
 {src:'m03.jpg',a:37.0,b:40.3,x:540,y:960,w:540,h:810,rot:1.5},
 {src:'m05.jpg',a:40.1,b:43.0,x:540,y:960,w:560,h:793,rot:1.5},
 {src:'m06.jpg',a:42.8,b:45.9,x:540,y:960,w:680,h:680,rot:-1},
 {src:'m08.jpg',a:50.1,b:54.3,x:540,y:960,w:560,h:793,rot:1},
 {src:'klas_parents.jpg',a:54.5,b:60.0,x:540,y:960,w:700,h:700,rot:-1.5},
 {src:'klas_ens.jpg',a:59.8,b:64.7,x:540,y:960,w:900,h:471,rot:1},
 {src:'declic_nuit.jpg',a:64.6,b:69.5,x:520,y:960,w:600,h:750,rot:-1},
 {src:'octobre.jpg',a:69.4,b:73.7,x:540,y:960,w:470,h:836,rot:1,c:2},
];
CARDS.forEach((c,i)=>{
  const fid='wv'+i;
  sv($('#defs').querySelector('defs'),'filter',{id:fid,x:'-10%',y:'-10%',width:'120%',height:'120%'}).innerHTML=
   `<feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="2" seed="${i+3}" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="0" xChannelSelector="R" yChannelSelector="G"/>`;
  c.disp=$('#'+fid).querySelector('feDisplacementMap');c.turb=$('#'+fid).querySelector('feTurbulence');
  c.el=el(`<div class="card" style="width:${c.w}px;height:${c.h}px"><img src="${A}${c.src}"></div>`);c.el.style.filter=`url(#${fid})`;
  c.img=c.el.querySelector('img');
  addDrop(c.x+(i%2?40:-40),c.y-80,c.a+.05,c.c??(i%3==1?0:1),1.2);
});
function drawCard(c,t){
  if(t<c.a||t>c.b){c.el.style.opacity=0;return}
  const i=ec(P(t,c.a,c.a+1.3)),o=ei(P(t,c.b-.9,c.b));
  const wav=(1-i)*90+o*110;
  c.disp.setAttribute('scale',wav.toFixed(1));c.turb.setAttribute('baseFrequency',`${(0.010+0.004*Math.sin(t*1.7)).toFixed(4)} ${(0.018+0.004*Math.cos(t*1.3)).toFixed(4)}`);
  const s=.94+.06*i-.06*o, y=c.y+(1-i)*50+o*60+Math.sin(t*1.1+c.a)*5, r=c.rot+Math.sin(t*.8+c.a)*.5;
  c.el.style.opacity=C(i*1.4)*(1-o);
  c.el.style.transform=`translate(${c.x-c.w/2}px,${y-c.h/2}px) rotate(${r}deg) scale(${s})`;
  // souvenir: desaturé et bleuté sous l'eau -> prend sa couleur en surfaçant
  const col=eio(P(t,c.a+.4,c.a+1.6))*(1-o);
  c.img.style.filter=`saturate(${.15+.85*col}) brightness(${.55+.45*col}) sepia(${(1-col)*.35}) hue-rotate(${(1-col)*170}deg) blur(${((1-i)*6+o*6).toFixed(1)}px)`;
}

/* ================= CAPTIONS (narration) ================= */
const CAPS=[];
function cap(html,a,b,y=1440,size){const words=html.split(/(<em>.*?<\/em>|\s+)/).filter(s=>s&&!/^\s+$/.test(s));
  const e=el(`<div class="cap" style="${size?'font-size:'+size+'px':''}">${words.map(w=>`<span class="w">${w}</span>`).join(' ')}</div>`);
  CAPS.push({e,a,b,y,ws:[...e.querySelectorAll('.w')]})}
function drawCap(o,t){
  if(t<o.a||t>o.b){o.e.style.opacity=0;return}
  const out=ei(P(t,o.b-.45,o.b));o.e.style.opacity=1-out;o.e.style.transform=`translateY(${o.y-out*20}px)`;o.e.style.filter=`blur(${(out*6).toFixed(1)}px)`;
  const tot=o.ws.reduce((s,w)=>s+w.textContent.length+1,0);let cum=0;const span=((o.sp||o.b)-o.a)*.92;
  o.ws.forEach((w,k)=>{const st=o.a+span*cum/tot;cum+=w.textContent.replace(/<[^>]+>/g,'').length+1;const p=eo(P(t,st,st+.45));w.style.opacity=p;w.style.transform=`translateY(${(1-p)*14}px)`;w.style.filter=`blur(${((1-p)*6).toFixed(1)}px)`});
}
const MONS=[];
function mon(txt,a,b){const e=el(`<div class="mon">${txt}<i></i></div>`);MONS.push({e,a,b})}
function drawMon(o,t){if(t<o.a||t>o.b){o.e.style.opacity=0;return}
  const i=eo(P(t,o.a,o.a+.7)),out=ei(P(t,o.b-.4,o.b));o.e.style.opacity=i*(1-out);o.e.style.transform=`translateY(${300-(1-i)*16}px)`;
  o.e.style.letterSpacing=(0.5-0.12*i)+'em'}

// ---- SCRIPT calé sur la voix ----
const TL=[{"txt": "À Douala, on raconte que les <em>Jengu</em> vivent dans l’eau.", "a": 3.0, "b": 7.47, "parts": [[3.0, 3.96], [4.41, 6.28], [6.42, 7.47]]}, {"txt": "Des esprits messagers, entre deux mondes.", "a": 8.37, "b": 11.6, "parts": [[8.37, 9.93], [10.38, 11.6]]}, {"txt": "Il y a un an, nous avons pris leur nom.", "a": 13.4, "b": 16.9, "parts": [[13.4, 14.84], [15.29, 16.9]]}, {"txt": "Pour être, nous aussi, un <em>messager</em>. Entre vous… et l’IA.", "a": 17.7, "b": 24.66, "parts": [[17.7, 18.72], [19.17, 20.28], [20.46, 21.61], [21.85, 23.01], [23.76, 24.66]]}, {"txt": "On a posé les bases.", "a": 26.06, "b": 27.72, "parts": [[26.06, 27.72]]}, {"txt": "On a expliqué l’IA, simplement. À l’artisan, à l’entrepreneur, au bureau.", "a": 28.52, "b": 36.56, "parts": [[28.52, 30.34], [30.79, 31.73], [32.18, 33.38], [33.83, 35.1], [35.55, 36.56]]}, {"txt": "On a accompagné des entreprises.", "a": 37.36, "b": 39.44, "parts": [[37.36, 39.44]]}, {"txt": "On a automatisé, testé… et recommencé.", "a": 40.24, "b": 44.92, "parts": [[40.24, 41.85], [42.3, 43.24], [43.69, 44.92]]}, {"txt": "On est allés écouter l’écosystème.", "a": 45.82, "b": 49.48, "parts": [[45.82, 48.27], [48.38, 49.48]]}, {"txt": "Puis on a transmis.", "a": 50.28, "b": 53.17, "parts": [[50.28, 51.29], [51.74, 53.17]]}, {"txt": "Et un jour… nos propres outils.", "a": 54.37, "b": 57.34, "parts": [[54.37, 55.46], [55.91, 57.34]]}, {"txt": "<em>Klas 237</em>, pour que nos enfants apprennent, petit à petit.", "a": 58.14, "b": 64.1, "parts": [[58.14, 60.27], [60.72, 62.53], [62.98, 64.1]]}, {"txt": "<em>Déclic</em>, pour que l’IA soit à la portée de tous.", "a": 64.9, "b": 68.98, "parts": [[64.9, 65.78], [66.23, 67.57], [67.65, 68.98]]}, {"txt": "Et toujours, avec le <em>cœur</em>.", "a": 69.78, "b": 72.22, "parts": [[69.78, 70.85], [70.95, 72.22]]}, {"txt": "Rien de tout ça n’aurait existé sans vous.", "a": 74.02, "b": 77.94, "parts": [[74.02, 75.39], [75.84, 77.14], [77.29, 77.94]]}, {"txt": "Chaque confiance a fait une <em>onde</em>.", "a": 78.84, "b": 82.27, "parts": [[78.84, 80.63], [81.08, 82.27]]}, {"txt": "Un an. Douze mois. Douze gouttes.", "a": 83.87, "b": 88.51, "parts": [[83.87, 84.71], [85.71, 86.69], [87.44, 88.51]]}, {"txt": "Et ce n’est que le début.", "a": 89.71, "b": 91.55, "parts": [[89.71, 90.62], [90.7, 91.55]]}, {"txt": "JenguAI.", "a": 92.45, "b": 93.65, "parts": [[92.45, 93.65]]}];
TL.slice(0,17).forEach((l,i)=>{const nx=TL[i+1]?TL[i+1].a-.08:l.b+1;cap(l.txt,l.a-.12,Math.min(nx,l.b+1.1),i>=13?1500:1440,l.txt.length>60?56:(l.txt.length>45?60:64));CAPS[CAPS.length-1].sp=l.b});
mon('DÉCEMBRE 2025',25.7,28.4);mon('JANVIER — FÉVRIER 2026',28.4,37.0);mon('MARS — AVRIL 2026',37.0,40.0);
mon('MAI — JUIN 2026',40.1,45.6);mon('JUILLET 2026',45.8,49.9);mon('AOÛT 2026',50.1,54.2);mon('SEPTEMBRE — OCTOBRE 2026',54.4,73.4);

/* ================= SIN : trajet lumineux Douala -> Yaoundé ================= */
const sin=sv($('#fx'),'g',{opacity:0});
const sinP=sv(sin,'path',{d:'M300 1100 C 420 900, 640 820, 790 700',fill:'none',stroke:'#F5C451','stroke-width':4,'stroke-linecap':'round'});
const sinL=sinP.getTotalLength();
sv(sin,'circle',{cx:300,cy:1100,r:12,fill:'#22D3EE'});
const sinT1=sv(sin,'text',{x:300,y:1165,fill:'#C9D6F2','font-family':'Manrope','font-weight':700,'font-size':34,'text-anchor':'middle'});sinT1.textContent='Douala';
const sinDot=sv(sin,'circle',{cx:790,cy:700,r:50,fill:'url(#orb)'});
const sinT2=sv(sin,'text',{x:790,y:625,fill:'#fff','font-family':'Manrope','font-weight':700,'font-size':36,'text-anchor':'middle'});sinT2.textContent='Yaoundé · SIN 2026';
const sinHead=sv(sin,'circle',{r:22,fill:'url(#orb)'});
addDrop(300,1100,45.85,0,1.2);
function drawSin(t){if(t<45.9||t>50.0){sin.setAttribute('opacity',0);return}
  sin.setAttribute('opacity',eo(P(t,45.9,46.5))*(1-ei(P(t,49.4,50.0))));
  const k=eio(P(t,46.3,48.0));sinP.style.strokeDasharray=`${sinL*k} ${sinL}`;
  const pt=sinP.getPointAtLength(sinL*k);sinHead.setAttribute('cx',pt.x);sinHead.setAttribute('cy',pt.y);
  sinDot.setAttribute('opacity',P(t,47.8,48.3));sinT2.setAttribute('opacity',P(t,48.0,48.6));
  if(k>=1&&!RIPS.find(r=>r.tag==='yde'))RIPS.push({x:790,y:700,t:48.0,s:1,c:1,tag:'yde'});
}
