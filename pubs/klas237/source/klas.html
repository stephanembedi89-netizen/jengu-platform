</style></head><body><div id="stage">
<div id="night"></div><div id="day"><div id="dots"></div></div>
<div class="blob" id="b1" style="width:700px;height:700px;background:#1E4FD8;opacity:.25"></div>

</div>
<script>
const C=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),P=(t,a,b)=>C((t-a)/(b-a));
const eo=x=>x>=1?1:1-Math.pow(2,-10*x),ei=x=>x*x*x,eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c1=1.7,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,k)=>a+(b-a)*k,$=s=>document.querySelector(s),Lr=$('#L');
const el=h=>{const d=document.createElement('div');d.innerHTML=h.trim();const e=d.firstChild;Lr.appendChild(e);return e};
let seed=3;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const IO=(t,a,b,din=.7,dout=.4)=>({i:eo(P(t,a,a+din)),o:ei(P(t,b-dout,b)),on:t>=a&&t<=b});

// ---------- texts (kinetic) ----------
const TX=[];
function tx(html,cls,a,b,y,o={}){const parts=html.split(/(<em[^>]*>.*?<\/em>|<br>|\s+)/).filter(s=>s&&!/^\s+$/.test(s));
 const e=el(`<div class="t ${cls}" style="${o.style||''}">${parts.map(w=>w==='<br>'?'<br>':`<span class="w">${w}</span>`).join(' ')}</div>`);
 TX.push({e,a,b,y,ws:[...e.querySelectorAll('.w')],st:o.st||.09})}
function drawTx(o,t){const {i,o:out,on}=IO(t,o.a,o.b);if(!on){o.e.style.opacity=0;return}
 o.e.style.opacity=1-out;o.e.style.transform=`translateY(${o.y-out*50}px) scale(${1-out*.04})`;
 o.ws.forEach((w,k)=>{const p=back(P(t,o.a+k*o.st,o.a+k*o.st+.5));const q=C(P(t,o.a+k*o.st,o.a+k*o.st+.25));
  w.style.opacity=q;w.style.transform=`translateY(${(1-p)*60}px) rotate(${(1-p)*4}deg)`})}

// S1 accroche 0-2.6
tx('20 h.','h',0.15,2.6,560,{style:'font-size:230px'});
tx('Compo <em>demain.</em>','h',0.75,2.6,820,{style:'font-size:120px'});

tx('Le relais entre l’école<br>et la maison.','s dk',7.9,9.2,1080,{style:'font-size:52px;color:#0B1B33',st:.05});
// S4 démo
tx('<em>10 minutes,</em><br>chaque soir.','h dk',9.3,13.2,250,{style:'font-size:84px'});
tx('Il explique<br><em>autrement.</em>','h dk',13.3,17.3,250,{style:'font-size:84px'});
tx('Un appui,<br><em class="r">pas une réponse à copier.</em>','h dk',17.4,21.0,250,{style:'font-size:70px'});
// S5 résultat
tx('De petits pas.','h dk',21.2,25.0,300,{style:'font-size:104px'});
tx('<em>De grandes réussites.</em>','h dk',21.9,25.0,430,{style:'font-size:86px'});
tx('Petit à petit.','hand dk',22.9,25.0,1330,{style:'font-size:110px',st:.12});
// S6 CTA
tx('Essayez <em>7 jours</em><br>gratuitement.','h',25.5,30,640,{style:'font-size:96px'});
tx('Sans carte bancaire · puis dès 2 500 FCFA / mois','s',26.4,30,900,{style:'font-size:38px',st:.04});

// ---------- S1 clock ring ----------
const clock=el(`<svg width="1080" height="1920" style="opacity:0"><circle cx="540" cy="700" r="430" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="6"/>
 <circle id="ck" cx="540" cy="700" r="430" fill="none" stroke="#FFD23F" stroke-width="10" stroke-linecap="round" transform="rotate(-90 540 700)"/></svg>`);
const ck=clock.querySelector('#ck'),CK=2*Math.PI*430;
// ---------- S2 bubbles ----------
const b1=el(`<div class="bub kid"><small>ALEX · CE2</small>« Je ne comprends pas… »</div>`);
const b2=el(`<div class="bub par"><small>MAMAN</small>« Je ne connais pas la méthode de l’école. »</div>`);
const b3=el(`<div class="bub kid" style="font-size:44px"><small>LE CAHIER</small>Exercices 3 et 4, page 42 😮‍💨</div>`);
function bub(e,t,a,b,x,y,r){const {i,o,on}=IO(t,a,b,.6,.35);if(!on){e.style.opacity=0;return}const k=back(P(t,a,a+.55));
 e.style.opacity=C(P(t,a,a+.2))*(1-o);e.style.transform=`translate(${x}px,${y+(1-k)*80-o*60+Math.sin(t*2+x)*5}px) rotate(${r*(.3+.7*k)}deg) scale(${.7+.3*k})`}
// ---------- logo ----------
const logo=el(`<div id="logo"><span class="k">Klas</span><span class="n">237</span></div>`);
// ---------- phone ----------
const phone=el(`<div id="phone"><div id="notch"></div><div id="scr"><img id="i1" src="kl/soir_0.png"><img id="i2" src="kl/assistant_0.png"><img id="i3" src="kl/soir_1.png"></div></div>`);
const I=['#i1','#i2','#i3'].map(s=>phone.querySelector(s));
// timer ring (beat 1)
const timer=el(`<svg width="1080" height="1920" style="opacity:0"><circle cx="850" cy="560" r="96" fill="#0E8A5F"/><circle cx="850" cy="560" r="78" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="12"/>
 <circle id="tr" cx="850" cy="560" r="78" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" transform="rotate(-90 850 560)"/>
 <text id="tt" x="850" y="576" text-anchor="middle" font-family="Sora" font-weight="800" font-size="44" fill="#fff">10:00</text></svg>`);
const tr=timer.querySelector('#tr'),tt=timer.querySelector('#tt'),TR=2*Math.PI*78;
const steps=['Ce qu’il a vu','Où ça bloque','On essaie ensemble'].map((s,k)=>el(`<div class="chip" style="background:#fff;color:#0B1B33"><b style="display:inline-block;width:46px;height:46px;line-height:46px;border-radius:50%;text-align:center;margin-right:14px;color:#fff;background:${['#0E8A5F','#E0393E','#E0A800'][k]}">${k+1}</b>${s}</div>`));
// beat 2 : assistant
const ask=['🎙 Dicter','📷 Photo du cahier','✍️ À la main'].map(s=>el(`<div class="chip" style="background:#0B1B33;color:#fff">${s}</div>`));
const tom=el(`<div class="card" style="width:860px;padding:40px 46px;background:#0B1B33;color:#fff;font:700 46px/1.3 Manrope"><div style="font:700 26px/1 Sora;letter-spacing:.14em;color:#FFD23F;margin-bottom:16px">✦ UNE AUTRE FAÇON</div>Au marché, 8 tomates à 400 FCFA.<br>La moitié ? <span style="color:#FFD23F">4 tomates, 200 FCFA.</span></div>`);
// beat 3 : série des soirs
const serie=el(`<div class="card" style="width:860px;padding:38px 46px;background:#FFD23F;color:#0B1B33"><div style="font:800 44px/1 Sora;margin-bottom:26px">La série des soirs 🔥</div><div id="dd" style="display:flex;gap:18px"></div><div style="font:700 34px/1.3 Manrope;margin-top:24px">La régularité plutôt que la course aux notes.</div></div>`);
const dd=serie.querySelector('#dd');const DOTS=[...'LMMJVSD'].map(l=>{const d=document.createElement('div');d.style.cssText='width:92px;height:92px;border-radius:26px;background:rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;font:800 40px Sora;color:#0B1B33';d.textContent=l;dd.appendChild(d);return d});
const offl=el(`<div class="chip" style="background:#fff;color:#0B1B33">📶 Même sans réseau</div>`);
const wa=el(`<div class="chip" style="background:#DCF8C6;color:#0B1B33">💬 Relais WhatsApp</div>`);
// S5 photo
const fam=el(`<div class="card" style="width:920px;height:557px;overflow:hidden;border:14px solid #fff"><img src="kl/famille.jpg" style="width:100%;height:100%;object-fit:cover"></div>`);
// S6 CTA
const cta=el(`<div class="card" style="width:880px;padding:40px 30px;background:#FFD23F;color:#0B1B33;text-align:center;border-radius:999px;font:800 58px/1 Sora">klas237.jengu-ai.com</div>`);
const pay=el(`<div class="t s" style="font-size:36px;color:#C8D6EE">Paiement par Mobile Money · Parents · Élèves · Enseignants</div>`);
const by=el(`<div class="t" style="font:700 34px/1 Sora;letter-spacing:.2em;color:#fff">PAR <span style="color:#F2B53A">JENGUAI</span> · DOUALA</div>`);

function place(e,x,y,w,h,{s=1,r=0,op=1,bl=0}={}){e.style.opacity=op;e.style.transform=`translate(${x-w/2}px,${y-h/2}px) rotate(${r}deg) scale(${s})`;e.style.filter=bl?`blur(${bl.toFixed(1)}px)`:'none'}
function pop(e,t,a,b,x,y,w,h,r=0){const on=t>=a&&t<=b;if(!on){e.style.opacity=0;return}const k=back(P(t,a,a+.5)),o=ei(P(t,b-.3,b));
 place(e,x,y+(1-k)*60-o*40+Math.sin(t*1.6+x)*4,w,h,{s:(.6+.4*k)*(1-o*.1),r:r,op:C(P(t,a,a+.2))*(1-o)})}

// captions = voix off
const CAP=[[0.2,2.5,'Vingt heures. Compo demain.'],[2.7,4.9,'Et le petit dit : « je ne comprends pas ».'],[5.0,6.9,'Vous voulez l’aider… mais la méthode a changé.'],
[7.2,9.1,'Klas 237. Le relais entre l’école et la maison.'],[9.3,13.1,'Dix minutes chaque soir. On part de son cahier.'],[13.3,17.2,'L’assistant explique autrement, avec les exemples de chez nous.'],
[17.4,20.9,'Un appui, pas une réponse à copier.'],[21.2,24.9,'Petit à petit, il comprend. Et vous respirez.'],[25.5,29.6,'Essayez sept jours, gratuitement.']];
const capS=$('#cap span');
const gc=$('#grain').getContext('2d'),G=[];for(let k=0;k<5;k++){const im=gc.createImageData(540,960);for(let i=0;i<im.data.length;i+=4){const v=128+(rnd()-.5)*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}G.push(im)}

window.DUR=30;
window.render=function(t){
 // fond : nuit -> jour (déclic à 7 s) -> nuit (CTA à 25.2)
 const day=eio(P(t,6.9,7.6))*(1-eio(P(t,25.0,25.6)));$('#day').style.opacity=day;
 $('#dots').style.transform=`translate(${-t*6%36}px,${-t*4%36}px)`;
 const b=$('#b1');b.style.transform=`translate(${200+120*Math.sin(t*.4)}px,${300+200*Math.cos(t*.3)}px)`;b.style.opacity=.25*(1-day);
 TX.forEach(o=>drawTx(o,t));
 // S1 clock
 {const {i,o,on}=IO(t,0,2.7,.5,.4);clock.style.opacity=on?i*(1-o):0;ck.setAttribute('stroke-dasharray',`${CK*eio(P(t,0.1,2.2))*.83} ${CK}`);clock.style.transform=`scale(${1+.03*Math.sin(t*3)})`;clock.style.transformOrigin='540px 700px'}
 // S2
 bub(b1,t,2.7,6.9,90,430,-3);bub(b3,t,3.5,6.9,300,700,2);bub(b2,t,4.2,6.9,230,890,3);
 // S3 logo (déclic) + fin
 {let op=0,y=780,s=1;logo.className='';
  if(t>=7.0&&t<9.3){const k=back(P(t,7.0,7.7)),o=ei(P(t,8.9,9.3));op=C(P(t,7,7.2))*(1-o);s=.5+.5*k;y=780-o*80}
  else if(t>=25.4){const k=back(P(t,25.4,26.1));op=C(P(t,25.4,25.6));s=(.5+.5*k)*.62;y=380;logo.className='wh'}
  logo.style.opacity=op;logo.style.transform=`translateY(${y-90}px) scale(${s})`}
 // phone 9.2 - 21.1
 {const on=t>=9.1&&t<=21.2;if(!on)phone.style.opacity=0;else{const k=eo(P(t,9.1,10.0)),o=ei(P(t,20.8,21.2));
   const bump=1+.03*Math.sin(Math.PI*P(t,13.2,13.7))+.03*Math.sin(Math.PI*P(t,17.3,17.8));
   const x=lerp(540,330,eio(P(t,9.9,10.6)));
   place(phone,x,905+(1-k)*900+o*200+Math.sin(t*1.2)*6,500,1000,{s:bump*.9,r:lerp(8,-3,k)+Math.sin(t*.8)*.6,op:1-o});
   const a2=eio(P(t,13.2,13.7)),a3=eio(P(t,17.3,17.8));
   I[0].style.opacity=1;I[1].style.opacity=a2;I[2].style.opacity=a3;
   I[0].style.transform=`translateY(${-lerp(0,230,eio(P(t,10.4,12.8)))}px)`;
   I[2].style.transform=`translateY(${-lerp(0,60,eio(P(t,17.8,20.5)))}px)`}}
 // beat 1 extras
 {const on=t>=10.2&&t<=13.2;timer.style.opacity=on?eo(P(t,10.2,10.7))*(1-ei(P(t,12.9,13.2))):0;const q=P(t,10.6,13.0);
  tr.setAttribute('stroke-dasharray',`${TR*(1-q*.35)} ${TR}`);const sec=Math.round(600-q*210);tt.textContent=`${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;
  steps.forEach((e,k)=>pop(e,t,10.7+k*.45,13.2,805,740+k*115,440,86,k%2?2:-2))}
 // beat 2 extras
 ask.forEach((e,k)=>pop(e,t,13.8+k*.25,17.3,830,560+k*110,[300,470,330][k],76,k%2?-2:2));
 pop(tom,t,14.8,17.3,540,1210,860,300,-1.5);
 // beat 3 extras
 pop(serie,t,17.9,21.0,545,1190,860,330,1.5);DOTS.forEach((d,k)=>{const p=back(P(t,18.4+k*.22,18.8+k*.22));const f=k<5;d.style.background=f&&p>0?'#0E8A5F':'rgba(255,255,255,.55)';d.style.color=f&&p>0?'#fff':'#0B1B33';d.style.transform=`scale(${f?(.6+.4*p||1):1})`});
 pop(offl,t,18.6,21.0,820,570,430,76,2);pop(wa,t,19.1,21.0,825,690,400,76,-2);
 // S5
 {const on=t>=21.6&&t<=25.1;if(!on)fam.style.opacity=0;else{const k=eo(P(t,21.6,22.5)),o=ei(P(t,24.7,25.1));place(fam,540,900+(1-k)*120,920,557,{s:.9+.1*k+.03*P(t,21.6,25),r:-2+k*.5,op:C(P(t,21.6,21.9))*(1-o),bl:(1-k)*10})}}
 // S6
 {const on=t>=26.9;if(!on)cta.style.opacity=0;else{const k=back(P(t,26.9,27.5));place(cta,540,1090,880,138,{s:(.6+.4*k)*(1+.025*Math.sin(t*5)),op:C(P(t,26.9,27.1))})}
  const p1=eo(P(t,27.5,28.2));pay.style.opacity=p1;pay.style.transform=`translateY(${1215+(1-p1)*20}px)`;
  const p2=eo(P(t,27.9,28.6));by.style.opacity=p2;by.style.transform=`translateY(${1330+(1-p2)*20}px)`}
 // captions
 const c=CAP.find(c=>t>=c[0]&&t<=c[1]);$('#cap').style.transform='translateY(1425px)';$('#cap').style.opacity=c?C(P(t,c[0],c[0]+.2))*(1-P(t,c[1]-.15,c[1])):0;if(c)capS.textContent=c[2];
 gc.putImageData(G[Math.floor(t*30)%5],0,0);
 $('#fade').style.opacity=(1-C(P(t,0,.25)))+ei(P(t,29.5,30));
};
window.ready=Promise.all([document.fonts.ready,...[...document.images].map(i=>i.decode().catch(()=>{}))]);
if(location.hash==='#play'){const t0=performance.now();(function L(){render(((performance.now()-t0)/1000)%DUR);requestAnimationFrame(L)})()}else render(0);
</script></body></html>
